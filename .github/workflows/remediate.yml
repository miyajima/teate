name: Teate remediation
on:
  schedule:
    - cron: '40 22 * * *' # 07:40 JST
  workflow_dispatch:
    inputs:
      repository:
        description: Registered owner/repository for a patch-PR gate check
        type: string
        required: false
      pr:
        description: Pull request number for a gate check
        type: number
        required: false
      apply:
        description: Request auto-merge when every policy check passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: teate-remediation
  cancel-in-progress: false
jobs:
  patch-gate:
    if: github.event.repository.private == true && vars.TEATE_OPERATIONS_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.repository != '' && inputs.pr > 0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.TEATE_GITHUB_TOKEN }}
      TEATE_TARGET_REPOSITORY: ${{ inputs.repository }}
      TEATE_PR_NUMBER: ${{ inputs.pr }}
      TEATE_APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Evaluate registered dependency update
        run: |
          python - <<'PY'
          import os
          import subprocess
          from teate.config import load_config
          config = load_config('config/ci.json')
          repository = os.environ['TEATE_TARGET_REPOSITORY']
          allowed = {a.get('repository') for a in config['assets']}
          if repository not in allowed:
              raise SystemExit('Repository is not registered')
          command = ['python', '-m', 'teate', '--config', 'config/ci.json', 'github', 'gate',
                     '--repository', repository, '--pr', str(int(os.environ['TEATE_PR_NUMBER']))]
          if os.environ['TEATE_APPLY'] == 'true':
              command.append('--apply')
          subprocess.run(command, check=True)
          PY
